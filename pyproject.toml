[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pystart"
dynamic = ["version"]
description = "Application desktop pour apprendre Python en pratiquant."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "feelsmanvt", email = "pystartcontact@gmail.com" }]
keywords = ["python", "education", "learning", "desktop", "ide"]
dependencies = [
    "PySide6>=6.6",
    "requests>=2.31",
    "packaging>=23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-qt>=4.2",
    "ruff>=0.4",
    "pyinstaller>=6.0",
]

[project.urls]
Homepage = "https://github.com/kikilikiki/Pystart"
Releases = "https://github.com/kikilikiki/Pystart/releases"

[project.gui-scripts]
pystart = "app.main:main"

[project.scripts]
pystart-updater = "app.updates.updater_cli:main"

[tool.setuptools]
packages = ["app"]

[tool.setuptools.dynamic]
version = { attr = "app.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Ajoute la racine du projet a sys.path pour que `import app` fonctionne
# quel que soit le mode de lancement (pytest, python -m pytest, CI).
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
