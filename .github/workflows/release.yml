name: release

# Se declenche quand on pousse un tag vX.Y.Z (voir Docs/updates.md).
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version a construire (ex: 0.0.2)"
        required: true

permissions:
  contents: write   # necessaire pour creer la Release et attacher des fichiers

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Recuperer le numero de version
        id: version
        shell: bash
        run: |
          V=$(python -c "import app; print(app.__version__)")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == v* && "$TAG" != "v$V" ]]; then
            echo "::error::Le tag $TAG ne correspond pas a app.__version__ ($V)"
            exit 1
          fi

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Construire l'application (PyInstaller)
        run: python scripts/build.py

      - name: Installer Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Construire l'installeur
        shell: cmd
        run: >
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          /DMyAppVersion=${{ steps.version.outputs.version }}
          scripts\Pystart.iss

      - name: Calculer le SHA-256
        id: hash
        shell: bash
        run: |
          F="dist/Pystart-Setup-${{ steps.version.outputs.version }}.exe"
          H=$(sha256sum "$F" | cut -d' ' -f1)
          echo "sha256=$H" >> "$GITHUB_OUTPUT"
          echo "$H  Pystart-Setup-${{ steps.version.outputs.version }}.exe" > dist/SHA256SUMS.txt

      - name: Publier la GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Pystart v${{ steps.version.outputs.version }}
          generate_release_notes: true
          body: |
            Installeur Windows : `Pystart-Setup-${{ steps.version.outputs.version }}.exe`

            SHA-256: ${{ steps.hash.outputs.sha256 }}

            Voir le CHANGELOG pour le detail des changements.
          files: |
            dist/Pystart-Setup-${{ steps.version.outputs.version }}.exe
            dist/SHA256SUMS.txt
