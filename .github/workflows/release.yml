name: release

# Se declenche quand on pousse un tag vX.Y.Z (voir Docs/updates.md).
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version a construire (ex: 0.0.2)"
        required: true

permissions:
  contents: write   # necessaire pour creer la Release et attacher des fichiers

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Recuperer le numero de version
        id: version
        shell: bash
        run: |
          V=$(python -c "import app; print(app.__version__)")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == v* && "$TAG" != "v$V" ]]; then
            echo "::error::Le tag $TAG ne correspond pas a app.__version__ ($V)"
            exit 1
          fi

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Construire l'application (PyInstaller)
        run: python scripts/build.py

      - name: Installer Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Construire l'installeur
        shell: cmd
        run: >
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          /DMyAppVersion=${{ steps.version.outputs.version }}
          scripts\Pystart.iss

      - name: Construire l'archive portable (Pystart.bat, sans admin ni alerte antivirus)
        run: python scripts/build_portable_zip.py

      - name: Calculer les SHA-256
        id: hash
        shell: bash
        run: |
          V="${{ steps.version.outputs.version }}"
          SETUP="dist/Pystart-Setup-$V.exe"
          PORTABLE="dist/Pystart-Portable-$V.zip"
          H_SETUP=$(sha256sum "$SETUP" | cut -d' ' -f1)
          H_PORTABLE=$(sha256sum "$PORTABLE" | cut -d' ' -f1)
          echo "sha256_setup=$H_SETUP" >> "$GITHUB_OUTPUT"
          echo "sha256_portable=$H_PORTABLE" >> "$GITHUB_OUTPUT"
          {
            echo "$H_SETUP  Pystart-Setup-$V.exe"
            echo "$H_PORTABLE  Pystart-Portable-$V.zip"
          } > dist/SHA256SUMS.txt

      - name: Publier la GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Pystart v${{ steps.version.outputs.version }}
          generate_release_notes: true
          body: |
            ## Deux facons d'installer Pystart (Windows)

            ### Option A - `Pystart-Portable-${{ steps.version.outputs.version }}.zip` (recommande, sans droits admin, sans alerte antivirus)
            Decompresse l'archive puis double-clique sur `Pystart.bat`. Utilise ton propre
            Python (3.10+, installe automatiquement si absent via un lien vers python.org).
            Aucun executable compile : pas d'alerte SmartScreen/antivirus, pas de droits
            administrateur. Pas de mise a jour en un clic dans ce mode : retelecharge
            l'archive a la prochaine version.

            ### Option B - `Pystart-Setup-${{ steps.version.outputs.version }}.exe` (installeur classique)
            Double-clique, suis l'assistant. Mise a jour en un clic ensuite (menu
            *Aide > Mises a jour*). L'installeur n'etant pas signe numeriquement,
            SmartScreen peut afficher "Editeur inconnu" : *Informations complementaires
            > Executer quand meme*.

            ### Verification (SHA-256)
            ```
            Pystart-Setup-${{ steps.version.outputs.version }}.exe      ${{ steps.hash.outputs.sha256_setup }}
            Pystart-Portable-${{ steps.version.outputs.version }}.zip   ${{ steps.hash.outputs.sha256_portable }}
            ```

            Voir le CHANGELOG pour le detail des changements.
          files: |
            dist/Pystart-Setup-${{ steps.version.outputs.version }}.exe
            dist/Pystart-Portable-${{ steps.version.outputs.version }}.zip
            dist/SHA256SUMS.txt
